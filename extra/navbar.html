       /* 🔹 NAVBAR */
.navbar {
  width: 100%;
  height: 90px;
  background: transparent;
  position: fixed;
  top: 0;
  left: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 2rem;
   transition: transform 0.4s ease, background 0.3s ease;
}
.navbar:hover,
.navbar.open {
  background:#53709f; /* adjust opacity as needed */
}
.navbar.hidden {
  transform: translateY(-100%);
}

.navbar.scrolled-up {
  transform: translateY(0);
}

.navbar.at-top {
  background: rgba(10, 80, 21, 0); /* fully transparent */
}

.navbar.at-top.hovered {
  background: rgba(83, 112, 159, 1); /* visible on hover */
}
.navbar .logo {
  font-size: 1.5rem;
  font-weight: bold;
  color: white;
  text-transform: uppercase;
  padding-left: 2rem;
  
}
.navbar.navbar-bg {
  background: rgba(83, 112, 159, 1); /* Your faded background */
}
.navbar nav {
  display: flex;
  gap: 2rem;
  position: relative;
}

.navbar nav a {
  color: white;
  text-decoration: none;
  font-size: 1rem;
  font-weight: 00;
  transition: opacity 0.3s;
  padding-right: 2rem;
}

.navbar nav a:hover {
  opacity: 0.7;
}

.nav-item {
  position: relative;
}

.dropdown {
  position: absolute;
  top: 100%;
  left: -2rem;
  background: #53709f;
  border-radius: 4px;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform: translateY(10px);
  transition: opacity 0.3s ease, transform 0.3s ease;
  z-index: 9;
  width: max-content; /* keeps it just wide enough for the text */
  min-width: 100px;   /* prevents it from being too narrow */
  height: auto;
  padding-left: 2rem;
  padding-right: 1rem; /* or however much you want */
}
.dropdown-text {
  display: flex;
  flex-direction: column;
  align-items: flex-start;  /* ✅ correct alignment */
  justify-content: flex-start;
  gap: 0.5rem;
  padding: 0;               /* ✅ remove default padding */
  margin: 0;                /* optional, for safety */
  padding-top: 2.5rem;
  padding-bottom: 0.80rem;
}


.nav-item.active .dropdown {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
  pointer-events: auto;
}

.dropdown-text h4,
.dropdown-text p,
.dropdown-text a,
.dropdown-text button {
  color: white;
  font-size: 1rem;
  font-weight: 500;
  text-align: left;

  text-decoration: none;
  background: none;
  border: none;
  cursor: pointer;
  transition: color 0.3s;
}
.dropdown-text h4 {
  padding-right: 1.5rem; /* ✅ add buffer space for the arrow */
}

.dropdown-text a:hover,
.dropdown-text button:hover {
  color: #e2e2e2;
}


.dropbtn {
  font-size: 1rem;
  line-height: 0.8;
 color: white;
  margin: 0;
  background: none;
  border: none; 
  
  font-family: "Montserrat";
  padding: 0;
  margin-top: 1rem;
  cursor: pointer;
}
/* 🔹 Animated underline setup */
.navbar nav a,
.dropdown-text h4 {
  position: relative;
  overflow: hidden;
}
.white-arrow {
  opacity: 0;
  transform: translateX(0);
  transition: opacity 0.3s ease, transform 0.3s ease;
  margin-left: 8px;
  vertical-align: middle;
}

/* Animate arrow on hover of the whole h4 */
.dropdown-text h4:hover .white-arrow {
  opacity: 1;
  transform: translateX(6px);
}
</style>

<script>
  // ✅ LOCOMOTIVE + SCROLLTRIGGER SETUP
  gsap.registerPlugin(ScrollTrigger);

  const scrollContainer = document.querySelector("[data-scroll-container]");

  // Only initialize once and attach to window so navbar.js can use it
  window.locoScroll = new LocomotiveScroll({
    el: scrollContainer,
    smooth: true
  });

  ScrollTrigger.scrollerProxy(scrollContainer, {
    scrollTop(value) {
      return arguments.length
        ? window.locoScroll.scrollTo(value, 0, 0)
        : window.locoScroll.scroll.instance.scroll.y;
    },
    getBoundingClientRect() {
      return {
        top: 0,
        left: 0,
        width: window.innerWidth,
        height: window.innerHeight
      };
    },
    pinType: scrollContainer.style.transform ? "transform" : "fixed"
  });

  window.locoScroll.on("scroll", ScrollTrigger.update);
  ScrollTrigger.addEventListener("refresh", () => window.locoScroll.update());
  ScrollTrigger.refresh();
</script>

<!-- ✅ Custom Scripts (after Locomotive setup) -->
<script>
//NAVBAR SCRIPT
const nav = document.querySelector('.navbar');
const navItems = document.querySelectorAll('.nav-item');
const logoImg = document.querySelector('.logo1');

let hideTimer;
let lastScrollY = 0;
let logoState = 'logo1';
let hasScrolledPastTop = false;

// 🔹 Check if mouse is inside nav or dropdown
function isMouseInsideNavOrDropdown(e) {
  const related = e.relatedTarget;
  return related && (nav.contains(related) || document.querySelector('.dropdown:hover'));
}

// 🔹 Remove navbar hover state if at top and not active
function maybeRemoveHovered() {
  const isDropdownActive = document.querySelector('.nav-item.active');
  const isNavHovered = nav.matches(':hover');

  if (window.locoScroll.scroll.instance.scroll.y <= 0 && !isDropdownActive && !isNavHovered) {
    nav.classList.remove('hovered', 'navbar-bg');
  }
}

// 🔹 Animate dropdown items with GSAP
function animateDropdown(item) {
  const dropdown = item.querySelector('.dropdown');
  const text = dropdown.querySelector('.dropdown-text');
  const images = dropdown.querySelectorAll('.image-box, .image-box2');

  if (text || images.length > 0) {
    gsap.killTweensOf([text, ...images]);
    gsap.set([text, ...images], { opacity: 0.5, y: 20 });

    gsap.to(text, {
      opacity: 1,
      y: 0,
      duration: 0.5,
      ease: "power2.out"
    });

    gsap.to(images, {
      opacity: 1,
      y: 0,
      duration: 0.6,
      stagger: 0.1,
      ease: "power2.out"
    });
  }
}

/*

function animateDropdown(item) {
  const dropdown = item.querySelector('.dropdown');
  const text = dropdown.querySelector('.dropdown-text');
  const images = dropdown.querySelectorAll('.image-box, .image-box2');

  const targets = [text, ...images].filter(Boolean);

  if (targets.length > 0) {
    gsap.killTweensOf(targets);
    gsap.set(targets, { opacity: 0, y: -10 }); // Start slightly above

    gsap.to(targets, {
      opacity: 1,
      y: 0,
      duration: 0.6,
      ease: 'power2.out'
    });
  }
}  
*/

// 🔹 Navbar mouse events
nav.addEventListener('mouseenter', () => {
  nav.classList.add('hovered');
  clearTimeout(hideTimer);
});

nav.addEventListener('mouseleave', (e) => {
  if (isMouseInsideNavOrDropdown(e)) return;
  hideTimer = setTimeout(() => {
    navItems.forEach(i => i.classList.remove('active'));
    maybeRemoveHovered();
  }, 200);
});

// 🔹 Dropdown triggers
navItems.forEach(item => {
  const dropdown = item.querySelector('.dropdown');
  const trigger = item.querySelector('a');

  trigger.addEventListener('mouseenter', () => {
    clearTimeout(hideTimer);
    navItems.forEach(i => i.classList.remove('active'));
    item.classList.add('active');

    nav.classList.add('hovered', 'navbar-bg');
    nav.classList.remove('hidden');
    nav.classList.add('scrolled-up');

    animateDropdown(item);
  });

  item.addEventListener('mouseleave', (e) => {
    if (isMouseInsideNavOrDropdown(e)) return;
    hideTimer = setTimeout(() => {
      item.classList.remove('active');
      maybeRemoveHovered();
    }, 200);
  });

  dropdown.addEventListener('mouseleave', (e) => {
    if (isMouseInsideNavOrDropdown(e)) return;
    hideTimer = setTimeout(() => {
      item.classList.remove('active');
      maybeRemoveHovered();
    }, 100);
  });
});

// 🔹 Scroll behavior logic
function handleScroll(currentScroll) {
  const scrollingDown = currentScroll > lastScrollY;
  const scrollingUp = currentScroll < lastScrollY;

  navItems.forEach(i => i.classList.remove('active'));

  if (currentScroll <= 0) {
    // Top of page
    nav.classList.remove('hidden', 'scrolled-up', 'navbar-bg');
    nav.classList.add('at-top');

    if (logoState !== 'logo1') {
      logoImg.src = 'images/logo1.png';
      logoState = 'logo1';
    }

    hasScrolledPastTop = false;
    maybeRemoveHovered();
    lastScrollY = currentScroll;
    return;
  }

  if (!hasScrolledPastTop) {
    hasScrolledPastTop = true;
  }

  if (scrollingDown) {
    // Scrolling down → hide navbar
    nav.classList.add('hidden');
    nav.classList.remove('scrolled-up', 'at-top', 'navbar-bg');
  } else if (scrollingUp) {
    // Scrolling up → show navbar
    nav.classList.remove('hidden');
    nav.classList.add('scrolled-up', 'hovered', 'navbar-bg');
    nav.classList.remove('at-top');

    if (logoState !== 'logo2') {
      logoImg.src = 'images/logo2.png';
      logoState = 'logo2';
    }

    // 🔹 If mouse is already over a nav-item, show its dropdown immediately
    const hoveredItem = document.querySelector('.nav-item:hover');
    if (hoveredItem) {
      hoveredItem.classList.add('active');
      animateDropdown(hoveredItem);
    }
  }

  lastScrollY = currentScroll;
}

// 🔹 Use Locomotive's scroll event
if (window.locoScroll) {
  window.locoScroll.on('scroll', (args) => {
    const scrollY = args.scroll.y;
    handleScroll(scrollY);
  });
} else {
  window.addEventListener('scroll', () => handleScroll(window.scrollY));
}

// 🔹 Button arrow GSAP nudge on hover
document.querySelectorAll('.dropbtn, .dropbtn-submit').forEach(btn => {
  const arrow = btn.querySelector('img');

  btn.addEventListener('mouseenter', () => {
    gsap.to(arrow, {
      x: 8,
      duration: 0.3,
      ease: 'power2.out'
    });
  });

  btn.addEventListener('mouseleave', () => {
    gsap.to(arrow, {
      x: 0,
      duration: 0.3,
      ease: 'power2.inOut'
    });
  });
});


</script>
