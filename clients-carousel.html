<!DOCTYPE html>

<head>

  <title>Client Scroll</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;800&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
    }

    .client-scroll-section {
      display: flex;
      flex-direction: column;
      gap: 12vh;
      padding: 50vh 4rem 50vh; /* starts in center of page */
    }

    .client-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 2rem;
      opacity: 0.3;
      transform: scale(0.95);
    }

    .client-row img {
      width: 350px;
      height: auto;
      object-fit: contain;
      transition: transform 0.3s ease;
    }

    @media (max-width: 768px) {
      .client-row {
        flex-wrap: wrap;
        justify-content: center;
      }

      .client-row img {
        width: 40%;
      }
    }
  </style>
</head>
<body>

<section class="client-scroll-section">

<script>
  gsap.registerPlugin(ScrollTrigger);

  document.querySelectorAll(".client-row").forEach((row) => {
    // Set base styles
    gsap.set(row, {
      opacity: 0.2,
      scale: 0.7,
      filter: "blur(10px)"
    });

    ScrollTrigger.create({
      trigger: row,
      start: "top 90%",
      end: "bottom 10%",
      scrub: true,
      onUpdate: (self) => {
        const progress = self.progress;
        const centeredness = 1 - Math.abs(progress - 0.5) * 2; // peak = 1 at center

        // Enhanced effects
        const scale = 0.7 + centeredness * 0.3;           // 0.7 → 1
        const opacity = 0.2 + centeredness * 0.8;         // 0.2 → 1
        const blur = 8 - centeredness * 10;              // 10px → 0px

        gsap.to(row, {
          scale,
          opacity,
          filter: `blur(${blur}px)`,
          duration: 0.1,
          overwrite: true
        });
      },
    });
  });
</script>
