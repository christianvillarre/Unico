<script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>

<script>
  const panels = document.querySelectorAll(".panel");
  const wrapper = document.querySelector(".accordion-wrapper");
  let currentIndex2 = 0;

  function showPanel(index) {
    panels.forEach((panel, i) => {
      gsap.to(panel, {
        height: i === index ? "600px" : "100px",
        duration: 0.5,
        ease: "power2.inOut"
      });
    });

    gsap.to(wrapper, {
      height: "98vh", // expanded height
      duration: 0.5,
      ease: "power2.inOut"
    });

    currentIndex2 = index;
  }

  // Open first panel by default
  showPanel(currentIndex2);

  panels.forEach((panel, index) => {
    panel.addEventListener("click", () => {
      if (currentIndex2 === index) {
        // Close panel
        gsap.to(panel, {
          height: "100px",
          duration: 0.4,
          ease: "power2.inOut"
        });

        // Shrink the wrapper
        gsap.to(wrapper, {
          height: "400px", // collapsed state
          duration: 0.5,
          ease: "power2.inOut"
        });

        currentIndex2 = -1;
      } else {
        showPanel(index);
      }
    });
  });
</script>
<script>
  const images = document.querySelectorAll(".scroller-image");
  const total = images.length;
  let currentIndex = 0; // ✅ Start with first image

  function renderStack(index) {
    images.forEach((img, i) => {
      const offset = (i - total + 1) * 150;
      const distance = Math.abs(i - index);
      const z = total - distance;

      img.classList.toggle("selected", i === index);

      gsap.set(img, {
        x: offset,
        scale: i === index ? 1 : 0.98,
        opacity: 1,
        zIndex: z
      });
    });
  }

  images.forEach((img, i) => {
    img.addEventListener("click", () => {
      currentIndex = i;
      renderStack(currentIndex);
    });
  });

  renderStack(currentIndex); // ✅ Initial render

  // ✅ Auto-advance every 5 seconds
  setInterval(() => {
    currentIndex = (currentIndex + 1) % total;
    renderStack(currentIndex);
  }, 3000);
</script>

<script>
  // ✅ LOCOMOTIVE + SCROLLTRIGGER SETUP
  gsap.registerPlugin(ScrollTrigger);

  const scrollContainer = document.querySelector("[data-scroll-container]");

  // Only initialize once and attach to window so navbar.js can use it
  window.locoScroll = new LocomotiveScroll({
    el: scrollContainer,
    smooth: true
  });

  ScrollTrigger.scrollerProxy(scrollContainer, {
    scrollTop(value) {
      return arguments.length
        ? window.locoScroll.scrollTo(value, 0, 0)
        : window.locoScroll.scroll.instance.scroll.y;
    },
    getBoundingClientRect() {
      return {
        top: 0,
        left: 0,
        width: window.innerWidth,
        height: window.innerHeight
      };
    },
    pinType: scrollContainer.style.transform ? "transform" : "fixed"
  });

  window.locoScroll.on("scroll", ScrollTrigger.update);
  ScrollTrigger.addEventListener("refresh", () => window.locoScroll.update());
  ScrollTrigger.refresh();
</script>
<script>
  const track = document.querySelector(".carousel-track");
  const nextBtn = document.querySelector(".carousel-btn.next");
  const prevBtn = document.querySelector(".carousel-btn.prev");
  const cardWidth = 25 * 16 + 56; // 25rem + gap (converted to px)
  let currentPosition = 0;

  nextBtn.addEventListener("click", () => {
    const maxScroll = track.scrollWidth - track.parentElement.offsetWidth;
    if (Math.abs(currentPosition) < maxScroll) {
      currentPosition -= cardWidth;
      gsap.to(track, { x: currentPosition, duration: 0.5, ease: "power2.out" });
    }
  });

  prevBtn.addEventListener("click", () => {
    if (currentPosition < 0) {
      currentPosition += cardWidth;
      gsap.to(track, { x: currentPosition, duration: 0.5, ease: "power2.out" });
    }
  });
</script>
